<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datagram Forwarding</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --accent:#38bdf8; --host:#f472b6; --sw:#22d3ee; --bad:#ef4444; --idle:#475569; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:1.2rem; text-align:center; border-bottom:1px solid #334155; }
  h1 { margin:0; font-size:1.2rem; } header p { margin:.2rem 0 0; color:#94a3b8; font-size:.85rem; }
  main { max-width:1050px; margin:0 auto; padding:1.2rem; display:grid; grid-template-columns:1.4fr 1fr; gap:1.1rem; }
  @media (max-width:860px){ main{grid-template-columns:1fr;} }
  .controls { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.8rem; }
  button { background:var(--panel); color:var(--ink); border:1px solid #334155; border-radius:9px; padding:.45rem .8rem; font-size:.85rem; cursor:pointer; }
  button:hover{ border-color:var(--accent);} button.primary{ background:var(--accent); color:#082f49; font-weight:600; }
  button.warn{ background:#7c2d12; }
  svg { width:100%; height:auto; background:var(--panel); border-radius:12px; border:1px solid #334155; }
  .node circle{ stroke:#0b1220; stroke-width:3; } .node.host circle{ fill:var(--host); } .node.sw circle{ fill:var(--sw); }
  .node text{ fill:#0b1220; font:600 14px system-ui; text-anchor:middle; pointer-events:none; }
  .node.hl circle{ filter:drop-shadow(0 0 9px #fff); stroke:#fff; }
  .link{ stroke:var(--idle); stroke-width:3; } .link.active{ stroke:var(--accent); stroke-width:5; }
  .tbl{ background:var(--panel); border:1px solid #334155; border-radius:10px; padding:.6rem .7rem; margin-bottom:.6rem; }
  .tbl h3{ margin:0 0 .35rem; font-size:.85rem; color:var(--sw); }
  .tbl table{ width:100%; border-collapse:collapse; font-size:.8rem; } .tbl td{ padding:.12rem .3rem; border-bottom:1px dashed #334155; }
  .tbl td.k{ color:#94a3b8; width:45%; }
  .log{ background:#0b1220; border:1px solid #334155; border-radius:10px; padding:.6rem; height:150px; overflow:auto;
        font-family:ui-monospace,Menlo,monospace; font-size:.78rem; } .log div{ padding:.12rem 0; }
  .log .ok{color:#22c55e;} .log .bad{color:var(--bad);} .log .info{color:#94a3b8;}
  .note{ color:#94a3b8; font-size:.8rem; grid-column:1/-1; } a{ color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Datagram Forwarding</h1>
  <p>Each switch uses its ⟨destination, next_hop⟩ table. Watch a packet hop toward its destination — or get stuck in a loop.</p>
</header>
<main>
  <div>
    <div class="controls">
      <button class="primary" id="sendOk">Send A → D (healthy)</button>
      <button class="warn" id="loop">Inject routing loop, then A → D</button>
      <button id="reset">Reset</button>
    </div>
    <svg viewBox="0 0 820 260" id="svg"></svg>
    <div class="log" id="log" style="margin-top:.8rem"></div>
  </div>
  <div id="tables"></div>
  <p class="note">Topology A─S1─S2─S3─S4─D, with B on S2 and C on S3. The loop button makes S2 forward D-traffic to S3 and S3 forward it back to S2. &larr; <a href="index.html">all animations</a></p>
</main>
<script>
const POS={A:[45,180],S1:[185,180],S2:[345,180],S3:[515,180],S4:[665,180],D:[780,180],B:[345,70],C:[515,70]};
const SW=['S1','S2','S3','S4'], HOSTS=['A','B','C','D'];
const EDGES=[['A','S1'],['S1','S2'],['S2','S3'],['S3','S4'],['S4','D'],['S2','B'],['S3','C']];
const HEALTHY={
  S1:{A:'local',B:'S2',C:'S2',D:'S2'},
  S2:{A:'S1',B:'local',C:'S3',D:'S3'},
  S3:{A:'S2',B:'S2',C:'local',D:'S4'},
  S4:{A:'S3',B:'S3',C:'S3',D:'local'}
};
let tables, busy=false;
const svg=document.getElementById('svg');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const k=(a,b)=>[a,b].sort().join('-');
function edgeIdx(a,b){return EDGES.findIndex(([x,y])=>(x===a&&y===b)||(x===b&&y===a));}
function nb(n){const o=[];EDGES.forEach(([a,b])=>{if(a===n)o.push(b);else if(b===n)o.push(a);});return o;}
function hl(n,on){const e=document.getElementById('n-'+n); if(e)e.classList.toggle('hl',on);}
function hlE(a,b,on){const l=document.getElementById('e-'+k(a,b)); if(l)l.classList.toggle('active',on);}
function build(){
  svg.innerHTML='';
  EDGES.forEach(([a,b])=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',POS[a][0]);l.setAttribute('y1',POS[a][1]);l.setAttribute('x2',POS[b][0]);l.setAttribute('y2',POS[b][1]);
    l.setAttribute('class','link');l.id='e-'+k(a,b);svg.appendChild(l);});
  Object.keys(POS).forEach(n=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','node '+(HOSTS.includes(n)?'host':'sw'));g.id='n-'+n;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',POS[n][0]);c.setAttribute('cy',POS[n][1]);c.setAttribute('r',21);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',POS[n][0]);t.setAttribute('y',POS[n][1]+5);t.textContent=n;
    g.appendChild(c);g.appendChild(t);svg.appendChild(g);});
}
function renderTables(){
  const host=document.getElementById('tables'); host.innerHTML='';
  SW.forEach(s=>{const div=document.createElement('div');div.className='tbl';
    const rows=Object.entries(tables[s]).map(([kk,vv])=>`<tr><td class="k">${kk}</td><td>${vv}</td></tr>`).join('');
    div.innerHTML=`<h3>${s} — forwarding table</h3><table>${rows}</table>`;host.appendChild(div);});
}
function log(m,c){const l=document.getElementById('log');const d=document.createElement('div');d.textContent=m;if(c)d.className=c;l.appendChild(d);l.scrollTop=l.scrollHeight;}

async function hop(from,to){hl(from,true);hlE(from,to,true);await sleep(500);hlE(from,to,false);hl(from,false);}

async function deliver(src,dst){
  if(busy)return; busy=true;
  log(`▶ ${src} → ${dst}`, 'info');
  let cur=nb(src).find(n=>SW.includes(n));
  await hop(src,cur);
  let ttl=12, hops=0, seen={};
  while(true){
    hops++;
    const nh=tables[cur][dst];
    log(`   ${cur}: destination ${dst} ⇒ next_hop ${nh}  (TTL ${ttl})`);
    if(nh==='local'){ // dst attached to cur
      await hop(cur,dst); hl(dst,true); await sleep(200); hl(dst,false);
      log(`✔ delivered to ${dst} after ${hops} switch(es).`, 'ok'); break;
    }
    seen[cur]=(seen[cur]||0)+1;
    if(seen[cur]>6 || ttl<=0){ log(`✘ LOOP DETECTED — packet is cycling and never arrives.`, 'bad'); break; }
    const nxt=nh;
    await hop(cur,nxt); 
    await sleep(120);
    cur=nxt; ttl--;
  }
  busy=false;
}

function reset(){ tables=JSON.parse(JSON.stringify(HEALTHY)); renderTables(); document.getElementById('log').innerHTML='';
  log('Tables reset to healthy routing.', 'info'); }
reset();
document.getElementById('reset').onclick=reset;
document.getElementById('sendOk').onclick=()=>deliver('A','D');
document.getElementById('loop').onclick=()=>{
  tables.S2.D='S3'; tables.S3.D='S2'; renderTables();
  log('⚠ Injected loop: S2 sends D-traffic → S3, S3 sends it → S2.', 'bad');
  deliver('A','D');
};
build();
</script>
</body>
</html>
